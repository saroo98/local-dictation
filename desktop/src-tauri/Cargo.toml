[package]
name = "local-dictation-desktop"
version = "0.1.0"
description = "Local Dictation desktop UI shell"
authors = ["Local Dictation"]
edition = "2021"

[lib]
name = "local_dictation_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
tauri = { version = "=2.11.2", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.4.2"
tauri-plugin-single-instance = "=2.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
